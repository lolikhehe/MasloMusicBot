services:
  bot-api:
    image: tdlib/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: 1
    command: ["--api-id=${TELEGRAM_API_ID}", "--api-hash=${TELEGRAM_API_HASH}", "--local", "--http-port=8081", "--dir=/var/lib/telegram-bot-api"]
    volumes:
      - botapi:/var/lib/telegram-bot-api
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      TELEGRAM_API_URL: http://bot-api:8081/
      DATABASE_URL: sqlite:///data/bot.db
      TMP_DIR: /data/tmp
      METRICS_ADDR: 0.0.0.0:9090
    volumes:
      - bot-data:/data
      - botapi:/var/lib/telegram-bot-api
    depends_on:
      - bot-api
    ports:
      - "9090:9090"
    restart: unless-stopped

volumes:
  bot-data:
  botapi:
