services:
  # Shared Postgres. Required by the bot: selections, rate limits and the
  # search cache live here so several replicas can serve webhook callbacks.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: musicbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: musicbot
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicbot -d musicbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Default: bot against the CLOUD Telegram Bot API (TELOXIDE_TOKEN in .env,
  # no api_id/api_hash needed). Set WEBHOOK_URL in .env to switch from long
  # polling to webhooks; several replicas can then sit behind a proxy.
  bot:
    build: .
    image: maslomusicbot:latest
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgresql://musicbot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/musicbot
      TMP_DIR: /data/tmp
      # yt-dlp (PyInstaller onefile) unpacks itself and its shared libraries
      # to a temp dir; the filesystem must allow mmap/exec. The /tmp tmpfs
      # mount is noexec, so Python's tempdir must point at the ext4 volume.
      TMPDIR: /data/tmp
      # deno (yt-dlp's JS runtime for YouTube EJS challenges) caches compiled
      # scripts; the root fs is read-only, so keep the cache on the volume.
      DENO_DIR: /data/tmp/deno
      # Downloads moved to the worker; only it updates yt-dlp. Leaving this on
      # here would make both containers race writes into /data/tmp/bin.
      YTDLP_AUTO_UPDATE: "false"
      METRICS_ADDR: 0.0.0.0:9090
      # WEBHOOK_URL / WEBHOOK_SECRET / WEBHOOK_ADDR come from .env when set.
      # TELEGRAM_API_URL is read from .env. Unset => cloud API.
      # For local bot-api set TELEGRAM_API_URL=http://bot-api:8081/ in .env.
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bot-data:/data
      # Local Bot API server returns absolute file paths in `getFile`; its
      # HTTP file endpoint does not serve them in --local mode. Read the files
      # from its volume directly (gid 101 owns the 0640 files).
      - botapi:/var/lib/telegram-bot-api:ro
    group_add:
      - "101" # telegram-bot-api group in the aiogram image
    # Both listeners are unauthenticated: /metrics and the webhook receiver.
    # Keep them on loopback; the Rust gateway reaches 8080 over the internal
    # Docker network, so no public host port is needed.
    ports:
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    # The app drains up to 30s (dispatcher shutdown timeout) + 20s tail;
    # SIGKILL at 45s would land mid-drain.
    stop_grace_period: 60s

  # Downloads run here, not in the bot, so webhook/polling replies stay fast
  # even with a long queue. Overrides the image entrypoint: `command:` would
  # append to the hard-coded "music-bot" arg instead of replacing it.
  worker:
    build: .
    image: maslomusicbot:latest
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/docker-entrypoint", "music-bot-worker"]
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_URL: postgresql://musicbot:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/musicbot
      TELEGRAM_API_URL: http://bot-api:8081/
      METRICS_ADDR: 0.0.0.0:9091
      TMP_DIR: /data/tmp
      TMPDIR: /data/tmp
      DENO_DIR: /data/deno
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - worker-data:/data
      - botapi:/var/lib/telegram-bot-api:ro
    group_add:
      - "101"
    ports:
      - "127.0.0.1:9091:9091"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 60s

  # Rust-only webhook gateway. Needs a public DNS A record pointing at this
  # host and ports 80/443 open. Enable with --profile webhook.
  gateway:
    profiles: ["webhook"]
    build:
      context: .
      dockerfile: Dockerfile.gateway
    image: maslomusicbot-gateway:latest
    environment:
      DOMAINS: ${WEBHOOK_DOMAIN:-music.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      ACME_PROD: ${ACME_PROD:-false}
      BOT_UPSTREAM: http://bot:8080
      WEBHOOK_PATH: /telegram/webhook
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - acme-cache:/cache
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 45s

  # Local Bot API server (files >50MB, --local shared volume). Requires
  # TELEGRAM_API_ID/TELEGRAM_API_HASH from https://my.telegram.org in .env.
  # NOTE: one-time logOut from the cloud API is required (see README).
  # Start with: docker compose --profile local up -d
  bot-api:
    profiles: ["local"]
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      # --local: raise the upload ceiling from 50 MB to ~2 GB
      TELEGRAM_LOCAL: "1"
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
      TELEGRAM_HTTP_PORT: "8081"
    volumes:
      - botapi:/var/lib/telegram-bot-api
    restart: unless-stopped
    stop_grace_period: 45s

  # Production monitoring. /metrics already exists on the bot (port 9090);
  # these two services scrape it and page into the bot's own /alert log sink.
  # Bound to loopback on the host on purpose: no authentication is configured.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    depends_on:
      bot:
        condition: service_healthy
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:19094:9093"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  bot-data:
  worker-data:
  botapi:
  pg-data:
  acme-cache:
  prom-data:
