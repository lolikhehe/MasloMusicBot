services:
  # Shared Postgres. Required by the bot: selections, rate limits and the
  # search cache live here so several replicas can serve webhook callbacks.
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: musicbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpass}
      POSTGRES_DB: musicbot
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicbot -d musicbot"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Default: bot against the CLOUD Telegram Bot API (TELOXIDE_TOKEN in .env,
  # no api_id/api_hash needed). Set WEBHOOK_URL in .env to switch from long
  # polling to webhooks; several replicas can then sit behind a proxy.
  bot:
    build: .
    image: maslomusicbot:latest
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://musicbot:${POSTGRES_PASSWORD:-devpass}@postgres:5432/musicbot
      TMP_DIR: /data/tmp
      # yt-dlp (PyInstaller onefile) unpacks itself and its shared libraries
      # to a temp dir; the filesystem must allow mmap/exec. The /tmp tmpfs
      # mount is noexec, so Python's tempdir must point at the ext4 volume.
      TMPDIR: /data/tmp
      # deno (yt-dlp's JS runtime for YouTube EJS challenges) caches compiled
      # scripts; the root fs is read-only, so keep the cache on the volume.
      DENO_DIR: /data/tmp/deno
      METRICS_ADDR: 0.0.0.0:9090
      # WEBHOOK_URL / WEBHOOK_SECRET / WEBHOOK_ADDR come from .env when set.
      # TELEGRAM_API_URL is read from .env. Unset => cloud API.
      # For local bot-api set TELEGRAM_API_URL=http://bot-api:8081/ in .env.
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - bot-data:/data
    ports:
      - "9090:9090"
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Local Bot API server (files >50MB, --local shared volume). Requires
  # TELEGRAM_API_ID/TELEGRAM_API_HASH from https://my.telegram.org in .env.
  # NOTE: one-time logOut from the cloud API is required (see README).
  # Start with: docker compose --profile local up -d
  bot-api:
    profiles: ["local"]
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      # --local: raise the upload ceiling from 50 MB to ~2 GB
      TELEGRAM_LOCAL: "1"
      TELEGRAM_WORK_DIR: /var/lib/telegram-bot-api
      TELEGRAM_TEMP_DIR: /tmp/telegram-bot-api
      TELEGRAM_HTTP_PORT: "8081"
    volumes:
      - botapi:/var/lib/telegram-bot-api
    restart: unless-stopped

volumes:
  bot-data:
  botapi:
  pg-data:
