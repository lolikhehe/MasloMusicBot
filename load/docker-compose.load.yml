# Self-contained load stand: k6 -> mock Bot API -> 3 bot replicas -> Postgres.
# Start from the repository root:
#   docker compose -f load/docker-compose.load.yml up -d --build
#   docker compose -f load/docker-compose.load.yml run --rm k6
# Prometheus: http://127.0.0.1:19090  Alertmanager: http://127.0.0.1:19094

x-bot-environment: &bot-environment
  TELOXIDE_TOKEN: "123:mock-token"
  TELEGRAM_API_URL: "http://mock-api:8081/"
  DATABASE_URL: "postgresql://musicbot:devpass@postgres:5432/musicbot"
  POSTGRES_PASSWORD: "devpass"
  LRCLIB_BASE_URL: "http://mock-api:8081"
  LYRICS_OVH_BASE_URL: "http://mock-api:8081/v1"
  METRICS_ADDR: "0.0.0.0:9090"
  WEBHOOK_URL: ""
  RATE_LIMIT_PER_MIN: "100000"
  RATE_LIMIT_INLINE_PER_MIN: "100000"
  MAX_CONCURRENT_DOWNLOADS: "4"
  ADMINS: ""
  LOG_LEVEL: "warn"
  YTDLP_AUTO_UPDATE: "false"
  TMP_DIR: "/data/tmp"
  TMPDIR: "/data/tmp"

x-bot-common: &bot-common
  build:
    context: ..
    dockerfile: Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    mock-api:
      condition: service_started
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: musicbot
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: musicbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicbot -d musicbot"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - load-pg-data:/var/lib/postgresql/data

  mock-api:
    build:
      context: ..
      dockerfile: load/Dockerfile.mock
    environment:
      MOCK_ADDR: "0.0.0.0:8081"
    ports:
      - "18081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  bot1:
    <<: *bot-common
    environment: *bot-environment
    ports:
      - "19091:9090"
    volumes:
      - load-bot1-data:/data

  bot2:
    <<: *bot-common
    environment: *bot-environment
    ports:
      - "19092:9090"
    volumes:
      - load-bot2-data:/data

  bot3:
    <<: *bot-common
    environment: *bot-environment
    ports:
      - "19093:9090"
    volumes:
      - load-bot3-data:/data

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - load-prom-data:/prometheus
    ports:
      - "19090:9090"
    depends_on:
      - bot1
      - bot2
      - bot3

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "19094:9093"
    depends_on:
      - prometheus

  k6:
    image: grafana/k6:latest
    volumes:
      - ./k6:/scripts:ro
      - ../target:/output
    environment:
      BASE_URL: "http://mock-api:8081"
      RPS: "${RPS:-50}"
      DURATION: "${DURATION:-2m}"
      SUMMARY_JSON: "/output/k6-summary.json"
    command: run /scripts/music-bot.js
    depends_on:
      - mock-api
      - prometheus

volumes:
  load-pg-data:
  load-bot1-data:
  load-bot2-data:
  load-bot3-data:
  load-prom-data:
