groups:
  - name: music-bot-load
    rules:
      - alert: MusicBotDown
        expr: up{job="music-bot"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Bot replica {{ $labels.instance }} is not scraping"

      - alert: MusicBotHighP95
        expr: histogram_quantile(0.95, sum by (le) (rate(music_bot_request_seconds_bucket[5m]))) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "End-to-end handler p95 above 1s for 2 minutes"
          description: "Current value: {{ $value | printf \"%.3f\" }}s"

      - alert: MusicBotErrorRate
        expr: sum(rate(music_bot_download_errors_total[5m])) / clamp_min(sum(rate(music_bot_downloads_total[5m])), 1) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "More than 10% of cold-path downloads fail"

      - alert: MockApiQueueBacklog
        expr: mock_queue_length > 1000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Injector outpacing the bot replicas (queue {{ $value }})"
