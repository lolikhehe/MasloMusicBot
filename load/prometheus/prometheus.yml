global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: music-bot
    metrics_path: /metrics
    static_configs:
      # Three long-polling replicas, all sharing Postgres and the mock API.
      # Add targets here when scaling the stand beyond three.
      - targets: ["bot1:9090", "bot2:9090", "bot3:9090"]

  - job_name: mock-api
    static_configs:
      - targets: ["mock-api:8081"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
