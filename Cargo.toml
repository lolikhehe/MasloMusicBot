[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Telegram music downloader bot on Rust (teloxide + yt-dlp)"
license = "MIT"

[workspace.dependencies]
ab_glyph = "0.2"
anyhow = "1"
dotenvy = "0.15"
html-escape = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
mimalloc = "0.1"
moka = { version = "0.12", features = ["future"] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "charset",
    "http2",
    "gzip",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
] }
teloxide = { version = "0.17", default-features = false, features = [
    "macros",
    "rustls",
    "throttle",
    "tracing",
] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

collage = { path = "crates/collage" }
common = { path = "crates/common" }
storage = { path = "crates/storage" }
providers = { path = "crates/providers" }
downloader = { path = "crates/downloader" }
audio = { path = "crates/audio" }
telegram = { path = "crates/telegram" }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# panic stays at unwind: a panicking task must not take the whole bot down
