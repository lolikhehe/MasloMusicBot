name: CI

on:
  push:
    branches: [main, exp/**]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: musicbot
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: musicbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U musicbot -d musicbot"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://musicbot:devpass@localhost:5432/musicbot
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: release build (offline SQL metadata)
        run: cargo build --workspace --release --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: build bot image
        run: docker build -t maslomusicbot:ci .

      - name: build gateway image
        run: docker build -f Dockerfile.gateway -t maslomusicbot-gateway:ci .

      - name: build load-test mock image
        run: docker build -f load/Dockerfile.mock -t maslomusicbot-mock-api:ci .
