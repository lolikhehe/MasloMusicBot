global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The production bot exposes /metrics and /healthz on METRICS_ADDR (9090).
  # Keep the job name "music-bot" so the alert rules work unchanged.
  - job_name: music-bot
    metrics_path: /metrics
    static_configs:
      - targets: ["bot:9090"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
