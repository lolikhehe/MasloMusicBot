route:
  receiver: bot-log
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h

receivers:
  # The bot's health listener accepts POST /alert and logs the notification.
  # Replace this receiver with Slack/PagerDuty when an external pager exists.
  - name: bot-log
    webhook_configs:
      - url: http://bot:9090/alert
        send_resolved: true
